services:
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped

  cue-core-1:
    image: vegardlu/cue-core:latest
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ALLOWED_CLIENT_IDS=${GOOGLE_CLIENT_ID}
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/cue
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - APP_SECURITY_SERVICE_TOKEN=${APP_SECURITY_SERVICE_TOKEN}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      - REDIS_HOST=valkey
    volumes:
      - ../lundedev-core/gcp-credentials.json:/app/gcp-credentials.json:ro
    depends_on:
      - valkey

  cue-core-2:
    image: vegardlu/cue-core:latest
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ALLOWED_CLIENT_IDS=${GOOGLE_CLIENT_ID}
      - DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/cue
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - APP_SECURITY_SERVICE_TOKEN=${APP_SECURITY_SERVICE_TOKEN}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      - REDIS_HOST=valkey
    volumes:
      - ../lundedev-core/gcp-credentials.json:/app/gcp-credentials.json:ro
    depends_on:
      - valkey

  cue-lb:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8095:8080"
    depends_on:
      - cue-core-1
      - cue-core-2

  cue-front-end:
    image: vegardlu/cue-front-end:latest
    restart: unless-stopped
    ports:
      - "3015:3000"
    env_file:
      - .env
