- id: '1786838400000'
  alias: 'Vidjeveien: Auto-vanning sitronplante'
  description: Vanner sitronplanten i små doser til jorda er over 60%, og lar den
    så tørke ned til 35% igjen. Grensene følger plantas egen målte rytme — den tørker
    rundt 6 prosentpoeng i døgnet, så bandet gir vanning omtrent hver fjerde dag,
    slik den har blitt vannet for hånd hele sommeren. En numeric_state-trigger utløses
    bare når verdien krysser grensa, så syklusen armerer seg selv.
  triggers:
  - entity_id: sensor.sitronplante_soil_moisture
    below: 35
    for: '00:30:00'
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: binary_sensor.third_reality_inc_3rwk0148z_moisture
    state: 'off'
  - condition: time
    after: '07:00:00'
    before: '22:00:00'
  actions:
  - data:
      title: "\U0001F4A7 Vanner sitronplanten"
      message: Jorda er nede i {{ states('sensor.sitronplante_soil_moisture') }}%.
        Starter vanning, og holder på til den er over 60%.
    action: notify.mobile_app_iphone_15_pro_vegard
  - data:
      title: "\U0001F4A7 Vanner sitronplanten"
      message: Jorda er nede i {{ states('sensor.sitronplante_soil_moisture') }}%.
        Starter vanning, og holder på til den er over 60%.
    action: notify.mobile_app_iphone
  - repeat:
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.third_reality_inc_3rwk0148z
      - delay:
          seconds: >-
            {{ (states('number.third_reality_inc_3rwk0148z_water_duration')
            | float(10) | round(0) | int) + 30 }}
      - action: switch.turn_off
        target:
          entity_id: switch.third_reality_inc_3rwk0148z
      - delay: '00:10:00'
      until:
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.sitronplante_soil_moisture
          above: 60
        - condition: template
          value_template: '{{ repeat.index >= 6 }}'
        - condition: state
          entity_id: binary_sensor.third_reality_inc_3rwk0148z_moisture
          state: 'on'
  - if:
    - condition: numeric_state
      entity_id: sensor.sitronplante_soil_moisture
      below: 60
    then:
    - data:
        title: "\U0001F4A7 Vanningen når ikke målet"
        message: Sitronplanten står fortsatt på {{ states('sensor.sitronplante_soil_moisture')
          }}% etter maks antall doser. Sjekk vannbeholder, filter og at dryppspydet
          står i potta.
      action: notify.mobile_app_iphone_15_pro_vegard
    - data:
        title: "\U0001F4A7 Vanningen når ikke målet"
        message: Sitronplanten står fortsatt på {{ states('sensor.sitronplante_soil_moisture')
          }}% etter maks antall doser. Sjekk vannbeholder, filter og at dryppspydet
          står i potta.
      action: notify.mobile_app_iphone
  mode: single
  max_exceeded: silent
