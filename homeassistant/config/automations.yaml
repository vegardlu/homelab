- id: '1770926356700'
  alias: 'Sitronplante: Auto-vanning virker ikke'
  description: Jorda holder seg kritisk tørr selv om pumpa har gått. Da er noe fysisk
    galt — tom beholder, tett filter eller et dryppspyd som har hoppet ut av potta.
  triggers:
  - entity_id: sensor.sitronplante_soil_moisture
    below: 20
    for: '02:00:00'
    trigger: numeric_state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: switch.third_reality_inc_3rwk0148z
      state: 'off'
      for:
        hours: 6
  actions:
  - data:
      title: "\U0001F198 SITRON-SOS!"
      message: Sitronplanten er på {{ states('sensor.sitronplante_soil_moisture') }}%
        etter to timer, selv om vanningen har gått. Sjekk vannbeholder, filter og
        at dryppspydet står i potta. 🍋🚱
    action: notify.mobile_app_iphone_15_pro_vegard
  - data:
      title: "\U0001F198 SITRON-SOS!"
      message: Sitronplanten er på {{ states('sensor.sitronplante_soil_moisture') }}%
        etter to timer, selv om vanningen har gått. Sjekk vannbeholder, filter og
        at dryppspydet står i potta. 🍋🚱
    action: notify.mobile_app_iphone
  mode: single
